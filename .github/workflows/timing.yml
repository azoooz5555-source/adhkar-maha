name: Fetch recitation timing

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_timing.py
      - .github/workflows/timing.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_timing.py
      - name: Commit timing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timing
          git diff --cached --quiet || git commit -m "تحديث بيانات توقيت الآيات"
          git push
